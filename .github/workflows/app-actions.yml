name: App action surface coverage
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --locked
      - run: uv run python -m pytest -q -p scripts.app_action_observer --app-action-report /tmp/app-action-execution.json --junitxml=/tmp/app-backend-results.xml
      - run: uv run ruff check src/xiliu scripts tests
      - run: uv run pyright src/xiliu
      - run: uv run pyright scripts/audit_app_surface.py scripts/verify_all_app_actions.py scripts/measure_sidecar_baseline.py tests/unit/test_app_surface_guard.py scripts/app_action_observer.py tests/integration/test_app_registry_coverage.py
      - run: uv run python scripts/audit_app_surface.py --output /tmp/app-surface.json
      - run: uv run python scripts/verify_all_app_actions.py --execution-report /tmp/app-action-execution.json --output /tmp/app-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-surface-coverage
          path: |
            /tmp/app-*.json
            /tmp/app-backend-results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-groups --locked
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Install isolated test browser
        run: |
          npm install --prefix .preview/browser-runtime --no-save playwright@1.62.1
          .preview/browser-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real UI, Agent equivalence and restart persistence
        shell: bash
        run: |
          browser_path=$(node -p "require('./.preview/browser-runtime/node_modules/playwright').chromium.executablePath()")
          uv run python scripts/run_browser_e2e.py --node "$(command -v node)" --module-dir "$GITHUB_WORKSPACE/.preview/browser-runtime/node_modules" --browser "$browser_path" --report-dir docs/audit/browser-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-browser-e2e
          path: docs/audit/browser-e2e
