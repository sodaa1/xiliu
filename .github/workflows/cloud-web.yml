name: Verify cloud deployment
on:
  push:
    branches: [main, 'codex/cloud-web-accounts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XILIU_CLOUD_ORIGIN: http://127.0.0.1:8765
      XILIU_CLOUD_LOCAL_HTTP: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Generate disposable encryption key
        run: |
          KEY=$(python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$KEY"
          echo "XILIU_CLOUD_MASTER_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Build actual production images
        run: docker compose -f deploy/cloud/compose.yaml build
      - name: Start isolated single instance
        run: docker compose -f deploy/cloud/compose.yaml up -d --wait
      - name: Exercise public API and guest assets
        run: python scripts/verify_cloud_service.py create
      - name: Exercise real outbound boundary
        run: |
          docker run -d --name cloud-canary --network xiliu-cloud_default python:3.12-slim-bookworm python -m http.server 80
          CANARY=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cloud-canary)
          docker exec cloud-canary python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1/').status==200"
          docker compose -f deploy/cloud/compose.yaml exec -T app python - "$CANARY" < scripts/qa/cloud-egress.py
          docker rm -f cloud-canary
      - name: Restart with same volume
        run: |
          docker compose -f deploy/cloud/compose.yaml restart app
          docker compose -f deploy/cloud/compose.yaml up -d --wait
          python scripts/verify_cloud_service.py verify
      - name: Restore a consistent backup into a new volume
        run: |
          docker compose -f deploy/cloud/compose.yaml stop app
          mkdir -p .preview/backup
          docker compose -f deploy/cloud/compose.yaml cp app:/data/. .preview/backup/
          docker compose -f deploy/cloud/compose.yaml down -v
          docker compose -f deploy/cloud/compose.yaml create
          docker compose -f deploy/cloud/compose.yaml cp .preview/backup/. app:/data/
          APP_IMAGE=$(docker compose -f deploy/cloud/compose.yaml images -q app)
          docker run --rm --user 0 --network none -v xiliu-cloud_data:/data --entrypoint python "$APP_IMAGE" -c "import os; os.chown('/data',10001,10001); [(os.chown(os.path.join(root,name),10001,10001)) for root,dirs,files in os.walk('/data') for name in dirs+files]"
          docker compose -f deploy/cloud/compose.yaml up -d --wait
          python scripts/verify_cloud_service.py verify
      - name: Package deployable source
        run: git archive --format=zip --output=xiliu-cloud-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: xiliu-cloud-source
          path: xiliu-cloud-source.zip
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/cloud/compose.yaml logs --no-color --tail 80
      - name: Cleanup disposable resources
        if: always()
        run: |
          docker compose -f deploy/cloud/compose.yaml down -v
          docker rm -f cloud-canary || true
